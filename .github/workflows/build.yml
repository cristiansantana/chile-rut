name: Build
run-name: ${{ github.actor }} is validating the package

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-package:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm audit --audit-level=moderate
            - name: Pack the package
              run: |
                  mkdir -p package
                  npm pack --pack-destination package
            - name: Verify the packed TypeScript declarations
              run: |
                  consumer_dir="${RUNNER_TEMP}/chile-rut-types-consumer"
                  mkdir -p "$consumer_dir"
                  cp test/package-consumer.ts "$consumer_dir/index.ts"
                  cd "$consumer_dir"
                  npm init --yes
                  npm pkg set type=module
                  npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/package/*.tgz
                  "$GITHUB_WORKSPACE"/node_modules/.bin/tsc \
                      --noEmit \
                      --strict \
                      --target es2016 \
                      --module node16 \
                      --moduleResolution node16 \
                      index.ts
            - name: Upload the package tarball
              uses: actions/upload-artifact@v4
              with:
                  name: package-tarball
                  path: package/*.tgz
                  if-no-files-found: error
                  retention-days: 1

    runtime-compatibility:
        needs: build-package
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [16.14.2, 18.x, 20.x, 22.x, 24.x]
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Download the package tarball
              uses: actions/download-artifact@v4
              with:
                  name: package-tarball
                  path: package
            - name: Verify the installed package
              run: |
                  consumer_dir="${RUNNER_TEMP}/chile-rut-runtime-consumer"
                  mkdir -p "$consumer_dir"
                  cd "$consumer_dir"
                  npm init --yes
                  npm pkg set type=module
                  npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/package/*.tgz
                  cp "$GITHUB_WORKSPACE"/test/package-runtime-consumer.mjs index.mjs
                  node index.mjs
