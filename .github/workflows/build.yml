name: Build
run-name: ${{ github.actor }} is validating the package

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:

        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node-version: [16.14.2, 18.x, 20.x, 22.x, 24.x]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm audit --audit-level=high
            - if: matrix.node-version == '24.x'
              run: npm pack --dry-run --json
